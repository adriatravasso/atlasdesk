spring:
  application:
    name: atlasdesk-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlasdesk}
    username: ${DB_USERNAME:atlasdesk}
    password: ${DB_PASSWORD:atlasdesk_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
