spring:
  application:
    name: atlasdesk-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlasdesk}
    username: ${DB_USERNAME:atlasdesk}
    password: ${DB_PASSWORD:atlasdesk_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
